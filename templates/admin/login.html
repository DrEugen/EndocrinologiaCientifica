{% extends "base.html" %}

{% block content %}
<section class="min-h-screen bg-slate-50 flex items-center justify-center px-6 relative">
    
    <div class="max-w-md w-full bg-white rounded-[2.5rem] p-12 shadow-xl border border-slate-100 relative">
        
        <div class="text-center mb-12">
            <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6 border border-slate-100">
                <span class="text-2xl">🛡️</span>
            </div>
            <h1 class="text-xl font-black text-[#208884] uppercase tracking-[0.2em]">Acceso Privado</h1>
            <p class="text-[#5BBFA3] text-[10px] mt-2 font-black uppercase tracking-widest italic">Panel de Gestión Administrativa</p>
        </div>

        <form action="/admin/login" method="POST" class="space-y-8">
            <div>
                <label class="block text-[10px] font-black text-[#208884] mb-3 uppercase tracking-[0.2em] ml-1 italic">Clave Maestra</label>
                <div class="relative">
                    <input type="password" name="password" required
                        class="w-full bg-slate-50 px-6 py-4 rounded-2xl border border-slate-200 text-slate-900 outline-none focus:ring-2 focus:ring-[#5BBFA3]/50 transition-all placeholder:text-slate-400 font-bold"
                        placeholder="••••••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-[#208884] text-white py-5 rounded-2xl font-black uppercase tracking-[0.2em] text-xs hover:bg-[#5BBFA3] transition-all duration-500 shadow-xl shadow-[#208884]/20">
                Verificar Identidad
            </button>
        </form>

        <div class="mt-12 text-center">
            <a href="/" class="text-[#5BBFA3] text-[10px] font-black uppercase tracking-[0.3em] hover:text-[#208884] transition-colors">
                ← Regresar al sitio
            </a>
        </div>
    </div>

    <div class="absolute bottom-10 text-[10px] text-slate-400 font-black tracking-[0.5em] uppercase italic">
        Portal Dr. Albert Igual
    </div>
</section>
{% endblock %}
