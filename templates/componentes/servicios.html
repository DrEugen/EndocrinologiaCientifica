<section id="servicios" class="{{ info.estilo.servicios.seccion_principal }} py-20">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto px-4">
        {% for servicio in lista_servicios %}
        <div class="flex flex-col bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-300 group">
            
            <div class="relative h-56 overflow-hidden">
                <img data-src="{{ servicio.imagen }}"
                     src="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 16 9'%3E%3C/svg%3E"
                     alt="{{ servicio.titulo }}" 
                     class="servicio-lazy-img w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 opacity-0 transition-opacity">
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
            </div>

            <div class="p-8 flex flex-col flex-grow">
                <h4 class="text-xl font-bold mb-3 {{ info.estilo.texto_fuerte }}">
                    {{ servicio.titulo }}
                </h4>
                
                <p class="text-slate-600 mb-6 flex-grow leading-relaxed">
                    {{ servicio.descripcion }}
                </p>

                <div class="mt-auto">
                    <a href="{{ url_for('servicio_detalle', slug=(servicio.slug or crear_slug(servicio.titulo))) }}" 
                       class="inline-flex items-center gap-2 font-bold text-sm uppercase tracking-wider transition-all hover:gap-3"
                       style="color: {{ info.estilo.color_tema }}">
                        Saber más 
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}         
    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const serviciosSeccion = document.getElementById('servicios');
        const imgs = document.querySelectorAll('.servicio-lazy-img');

        if (serviciosSeccion && imgs.length > 0) {
            const obs = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        imgs.forEach(img => {
                            if (img.dataset.src) {
                                img.src = img.dataset.src;
                                img.classList.remove('opacity-0');
                            }
                        });
                        observer.disconnect();
                    }
                });
            }, { rootMargin: "200px 0px" });

            obs.observe(serviciosSeccion);
        }
    });
</script>
