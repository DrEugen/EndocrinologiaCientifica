{% extends "base.html" %}

{% block content %}
<section class="min-h-screen bg-slate-50 flex items-center justify-center py-20 px-6 relative overflow-hidden">
    <div class="absolute inset-0 bg-[#208884]/5 rounded-full blur-[150px] opacity-20 -z-0"></div>
    
    <div class="relative z-10 text-center max-w-2xl mx-auto space-y-8">
        <p class="text-8xl md:text-[10rem] font-black text-[#208884]/20 leading-none mb-4 animate-fade-in-up">404</p>
        
        <h1 class="text-3xl md:text-5xl font-black text-[#208884] mb-6 animate-fade-in-up delay-200">
            ¡Uhm... parece que el enlace está fuera de lugar!
        </h1>
        
        <p class="text-lg text-slate-500 leading-relaxed mb-10 animate-fade-in-up delay-400">
            La página que buscas no existe o ha sido trasladada. Regresemos a un lugar más conocido.
        </p>
        
        <div class="flex flex-col sm:flex-row justify-center gap-6 animate-fade-in-up delay-600">
            <a href="/" class="bg-[#208884] text-white px-10 py-5 rounded-2xl font-black uppercase tracking-widest text-sm hover:bg-[#5BBFA3] transition-all shadow-xl shadow-[#208884]/20">
                Volver a la Home
            </a>
            <a href="/contactenos" class="px-10 py-5 rounded-2xl font-black text-[#208884] border-2 border-[#208884] hover:bg-[#208884] hover:text-white transition-all uppercase tracking-widest text-sm">
                Contactar Soporte
            </a>
        </div>
    </div>
</section>

<style>
@keyframes fade-in-up {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.animate-fade-in-up {
    animation: fade-in-up 0.6s ease-out forwards;
    opacity: 0;
}

.delay-200 { animation-delay: 0.2s; }
.delay-400 { animation-delay: 0.4s; }
.delay-600 { animation-delay: 0.6s; }
</style>

{% endblock %}
